<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}Mailer Service{% endblock %}</title>
    <link
            rel="stylesheet"
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
    />
</head>
<body>

<header>
    <nav class="navbar navbar-expand-lg navbar-light bg-light mb-4">
        <div class="container-fluid">

            <a class="navbar-brand" href="{% url 'index' %}">Главная</a>

            <div class="collapse navbar-collapse">

                <ul class="navbar-nav me-auto">

                    {% if user.is_authenticated %}
                    <li class="nav-item"><a class="nav-link" href="{% url 'mailing:recipient_list' %}">Получатели</a>
                    </li>
                    <li class="nav-item"><a class="nav-link" href="{% url 'mailing:message_list' %}">Сообщения</a></li>
                    <li class="nav-item"><a class="nav-link" href="{% url 'mailing:mailing_list' %}">Рассылки</a></li>
                    <li class="nav-item"><a class="nav-link" href="{% url 'mailing:attempt_list' %}">Попытки
                        рассылок</a></li>
                    {% else %}
                    <li class="nav-item"><a class="nav-link" href="{% url 'login' %}">Вход</a></li>
                    <li class="nav-item"><a class="nav-link" href="{% url 'register' %}">Регистрация</a></li>
                    {% endif %}
                </ul>

                {% if user.is_authenticated %}
                <form method="post" action="{% url 'logout' %}">
                    {% csrf_token %}
                    <button class="btn btn-outline-danger" type="submit">Выход</button>
                </form>
                {% endif %}

            </div>

        </div>
    </nav>

</header>

<hr>

<main>
    {% block content %}
    {% endblock %}
</main>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
