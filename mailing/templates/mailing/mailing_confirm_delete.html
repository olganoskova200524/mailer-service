{% extends "base.html" %}
{% block title %}Удалить рассылку{% endblock %}

{% block content %}
<div class="card border-danger">
    <div class="card-header bg-danger text-white">
        Подтверждение удаления
    </div>
    <div class="card-body">
        <p class="mb-3">
            Вы действительно хотите удалить рассылку
            <strong>#{{ object.pk }}</strong>
            ({{ object.message.subject }})?
        </p>
        <form method="post">
            {% csrf_token %}
            <button type="submit" class="btn btn-danger">
                Да, удалить
            </button>
            <a href="{% url 'mailing:mailing_list' %}" class="btn btn-outline-secondary ms-2">
                Отмена
            </a>
        </form>
    </div>
</div>
{% endblock %}
