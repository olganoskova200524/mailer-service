{% extends "base.html" %}

{% block title %}Удалить получателя{% endblock %}

{% block content %}
<h1>Удалить получателя</h1>

<p>Вы действительно хотите удалить "{{ object }}"?</p>

<form method="post">

    <a href="{% url 'mailing:recipient_list' %}">Отмена</a>
</form>
{% endblock %}
